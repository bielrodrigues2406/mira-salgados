# Serve a aplicação Angular e encaminha /api para a API na mesma origem: o
# cookie de sessão (SameSite=Strict) acompanha as requisições sem CORS.
# Em produção, o TLS termina num proxy à frente deste contêiner.

server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  server_tokens off;

  location /api/ {
    proxy_pass http://api:3000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    client_max_body_size 100k;
  }

  # Arquivos com hash no nome podem ficar em cache por um ano.
  location ~* \.(?:js|css|woff2?|ico|png|svg)$ {
    include /etc/nginx/snippets/security-headers.conf;
    add_header Cache-Control "public, max-age=31536000, immutable" always;
    try_files $uri =404;
  }

  location / {
    include /etc/nginx/snippets/security-headers.conf;
    # index.html nunca vai para cache: é ele que aponta para os arquivos da versão atual.
    add_header Cache-Control "no-store" always;
    # O Angular aplica o nonce aos estilos que injeta em tempo de execução; o
    # nonce muda a cada requisição e dispensa 'unsafe-inline' na CSP.
    sub_filter_once off;
    sub_filter_types text/html;
    sub_filter 'CSP_NONCE' $request_id;
    try_files $uri $uri/ /index.html;
  }
}
