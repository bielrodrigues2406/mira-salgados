# Modelo para colocar outra aplicação no mesmo servidor. Copie a pasta para
# /srv/apps/<nome>, troque "minha-app" pelo nome e as imagens pelas suas.
# Regras que mantêm as aplicações isoladas:
#   - nenhuma porta publicada (só o proxy abre 80 e 443);
#   - banco próprio, na rede interna da aplicação;
#   - só o serviço que responde HTTP entra na rede "proxy", com um alias único;
#   - limite de memória em cada serviço.

name: minha-app

services:
  db:
    image: postgres:18.6-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: minha_app
      POSTGRES_USER: minha_app
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?defina POSTGRES_PASSWORD no .env}
    volumes:
      - pgdata:/var/lib/postgresql
    mem_limit: 512m

  app:
    image: ghcr.io/SEU-USUARIO/minha-app:${VERSAO:-latest}
    restart: unless-stopped
    environment:
      DATABASE_URL: postgres://minha_app:${POSTGRES_PASSWORD}@db:5432/minha_app
    networks:
      default:
      proxy:
        aliases: [minha-app]
    depends_on: [db]
    mem_limit: 256m

networks:
  proxy:
    external: true

volumes:
  pgdata:
