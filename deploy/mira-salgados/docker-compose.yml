# Mira Salgados no servidor: imagens prontas do GHCR, sem build aqui.
# Nenhuma porta publicada: o proxy compartilhado chega na web pela rede
# "proxy", e banco e API ficam só na rede interna da aplicação.
#   cd /srv/apps/mira-salgados && ./atualizar.sh

name: mira-salgados

x-database-url: &database-url postgres://${POSTGRES_USER:-mira}:${POSTGRES_PASSWORD:?defina POSTGRES_PASSWORD no .env}@db:5432/${POSTGRES_DB:-mira_salgados}
x-imagem-api: &imagem-api ghcr.io/bielrodrigues2406/mira-salgados-api:${VERSAO:-latest}

services:
  db:
    image: postgres:18.6-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-mira_salgados}
      POSTGRES_USER: ${POSTGRES_USER:-mira}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?defina POSTGRES_PASSWORD no .env}
    volumes:
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"']
      interval: 5s
      timeout: 3s
      retries: 10
    mem_limit: 512m

  migrate:
    image: *imagem-api
    command:
      [
        'node',
        '/app/node_modules/typeorm/cli.js',
        'migration:run',
        '-d',
        'dist/database/data-source.js',
      ]
    environment:
      DATABASE_URL: *database-url
    depends_on:
      db:
        condition: service_healthy
    restart: 'no'

  api:
    image: *imagem-api
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 3000
      LOG_LEVEL: ${LOG_LEVEL:-info}
      DATABASE_URL: *database-url
      CORS_ORIGINS: ${WEB_ORIGIN:?defina WEB_ORIGIN no .env, como https://mirasalgados.com.br}
      # Caddy -> nginx -> API.
      TRUST_PROXY: 2
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:?defina JWT_ACCESS_SECRET no .env}
      COOKIE_SECURE: 'true'
    depends_on:
      migrate:
        condition: service_completed_successfully
    mem_limit: 384m

  web:
    image: ghcr.io/bielrodrigues2406/mira-salgados-web:${VERSAO:-latest}
    restart: unless-stopped
    networks:
      default:
      proxy:
        # Nome único na rede compartilhada: outra aplicação também pode ter um "web".
        aliases: [mira-salgados-web]
    depends_on:
      api:
        condition: service_healthy
    mem_limit: 64m

networks:
  proxy:
    external: true

volumes:
  pgdata:
