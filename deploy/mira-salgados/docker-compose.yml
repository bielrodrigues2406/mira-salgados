# Mira Salgados no servidor: imagens prontas do GHCR, sem build aqui.
# Nenhuma porta publicada: o proxy compartilhado chega na web pela rede
# "proxy", e banco e API ficam só na rede interna da aplicação.
#   cd /srv/apps/mira-salgados && ./atualizar.sh

name: mira-salgados

x-database-url: &database-url postgres://${POSTGRES_USER:-mira}:${POSTGRES_PASSWORD:?defina POSTGRES_PASSWORD no .env}@db:5432/${POSTGRES_DB:-mira_salgados}
x-imagem-api: &imagem-api ghcr.io/bielrodrigues2406/mira-salgados-api:${VERSAO:-latest}

services:
  db:
    image: postgres:18.6-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-mira_salgados}
      POSTGRES_USER: ${POSTGRES_USER:-mira}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?defina POSTGRES_PASSWORD no .env}
    volumes:
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"']
      interval: 5s
      timeout: 3s
      retries: 10
    mem_limit: 512m

  migrate:
    image: *imagem-api
    command:
      [
        'node',
        '/app/node_modules/typeorm/cli.js',
        'migration:run',
        '-d',
        'dist/database/data-source.js',
      ]
    environment:
      DATABASE_URL: *database-url
    depends_on:
      db:
        condition: service_healthy
    restart: 'no'

  api:
    image: *imagem-api
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 3000
      LOG_LEVEL: ${LOG_LEVEL:-info}
      DATABASE_URL: *database-url
      CORS_ORIGINS: ${WEB_ORIGIN:?defina WEB_ORIGIN no .env, como https://mirasalgados.com.br}
      # Caddy -> nginx -> API.
      TRUST_PROXY: 2
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:?defina JWT_ACCESS_SECRET no .env}
      COOKIE_SECURE: 'true'
      NOTIFICACOES_MODO: ${NOTIFICACOES_MODO:-SIMULADO}
      NOTIFICACOES_CONECTOR_URL: ${NOTIFICACOES_CONECTOR_URL:-}
      NOTIFICACOES_CONECTOR_TOKEN: ${NOTIFICACOES_CONECTOR_TOKEN:-}
      NOTIFICACOES_CONECTOR_DEVICE_ID: ${NOTIFICACOES_CONECTOR_DEVICE_ID:-}
    depends_on:
      migrate:
        condition: service_completed_successfully
    mem_limit: 384m

  # Worker isolado e gateway GoWA (opcional: ative com `--profile notificacoes`).
  # Ficam apenas na rede interna Docker, sem nenhuma porta publicada no host.
  worker:
    image: *imagem-api
    profiles: ['notificacoes']
    command: ['node', 'dist/worker.js']
    restart: unless-stopped
    healthcheck:
      disable: true
    environment:
      NODE_ENV: production
      LOG_LEVEL: ${LOG_LEVEL:-info}
      DATABASE_URL: *database-url
      CORS_ORIGINS: ${WEB_ORIGIN:?defina WEB_ORIGIN no .env, como https://mirasalgados.com.br}
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:?defina JWT_ACCESS_SECRET no .env}
      NOTIFICACOES_MODO: ${NOTIFICACOES_MODO:-GOWA}
      NOTIFICACOES_CONECTOR_URL: ${NOTIFICACOES_CONECTOR_URL:-http://gowa:3000}
      # Obrigatórios quando o perfil notificacoes está ativo (validados no boot pelo env.schema.ts).
      NOTIFICACOES_CONECTOR_TOKEN: ${NOTIFICACOES_CONECTOR_TOKEN:-}
      NOTIFICACOES_CONECTOR_DEVICE_ID: ${NOTIFICACOES_CONECTOR_DEVICE_ID:-}
      NOTIFICACOES_WEBHOOK_HOST: 0.0.0.0
      NOTIFICACOES_WEBHOOK_PORT: 3001
      NOTIFICACOES_WEBHOOK_SECRET: ${NOTIFICACOES_WEBHOOK_SECRET:-}
    depends_on:
      migrate:
        condition: service_completed_successfully
    mem_limit: 192m

  gowa:
    image: ghcr.io/aldinokemal/go-whatsapp-web-multidevice:v9.11.0
    profiles: ['notificacoes']
    restart: unless-stopped
    command: ['rest']
    environment:
      APP_PORT: 3000
      APP_OS: MiraSalgados
      APP_BASIC_AUTH: ${NOTIFICACOES_CONECTOR_TOKEN:-}
      WHATSAPP_WEBHOOK: http://worker:3001/webhooks/whatsapp
      WHATSAPP_WEBHOOK_EVENTS: message.ack,device.logged_out,device.temporary_ban,device.reachout_timelock
      WHATSAPP_WEBHOOK_SECRET: ${NOTIFICACOES_WEBHOOK_SECRET:-}
      WHATSAPP_AUTO_REJECT_CALL: 'true'
    volumes:
      # Volume próprio de sessão WhatsApp, fora do backup do PostgreSQL (ADR 0019).
      - gowa_session:/app/storages
    mem_limit: 128m

  web:
    image: ghcr.io/bielrodrigues2406/mira-salgados-web:${VERSAO:-latest}
    restart: unless-stopped
    networks:
      default:
      proxy:
        # Nome único na rede compartilhada: outra aplicação também pode ter um "web".
        aliases: [mira-salgados-web]
    depends_on:
      api:
        condition: service_healthy
    mem_limit: 64m

networks:
  proxy:
    external: true

volumes:
  pgdata:
  gowa_session:
