<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>Entrar</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&amp;display=swap">
<style>
body{margin:0;background:#0F2440;font-family:'IBM Plex Sans',system-ui,-apple-system,'Segoe UI',sans-serif;color:#0F2440;-webkit-font-smoothing:antialiased}
a{color:#1E3A5F}a:hover{color:#0F2440}
button,input,select,textarea{font:inherit;color:inherit}
a,button,input{transition:color 150ms ease,background-color 150ms ease,border-color 150ms ease}
:focus-visible{outline:2px solid #1E3A5F;outline-offset:2px}
.escuro :focus-visible{outline-color:#FFFFFF}
input::placeholder{color:#8E97A3}
input:focus{border-color:#1E3A5F !important;box-shadow:0 0 0 3px rgba(30,58,95,0.2);outline:none}
.num{font-variant-numeric:tabular-nums}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #0F2440; overflow-y: auto; padding: 40px 16px 32px; display: flex; flex-direction: column; gap: 20px">

<div style="margin-top: auto; margin-bottom: auto; display: flex; flex-direction: column; gap: 20px">
<form onSubmit="{{aoEnviar}}" style="background: #FFFFFF; border-radius: 8px; padding: 24px 20px; display: flex; flex-direction: column; gap: 20px">

<div style="display: flex; align-items: center; gap: 12px">
<span aria-hidden="true" style="width: 40px; height: 40px; border-radius: 8px; background: #0F2440; color: #FFFFFF; font-size: 18px; font-weight: 700; display: flex; align-items: center; justify-content: center">M</span>
<div style="display: flex; flex-direction: column">
<span style="font-size: 24px; font-weight: 700; letter-spacing: -0.02em; line-height: 30px">Mira Salgados</span>
<span style="font-size: 12px; color: #5A6472">Gestão de encomendas</span>
</div>
</div>

<div style="display: flex; flex-direction: column; gap: 16px">
<label style="display: flex; flex-direction: column; gap: 6px">
<span style="font-size: 11px; font-weight: 600; letter-spacing: 0.06em; text-transform: uppercase; color: #5A6472">E-mail</span>
<span style="position: relative; display: block">
<span aria-hidden="true" style="position: absolute; left: 12px; top: 14px; color: #5A6472; display: flex"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.25" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="4" width="20" height="16" rx="2"/><path d="m22 7-8.97 5.7a1.94 1.94 0 0 1-2.06 0L2 7"/></svg></span>
<input type="email" autocomplete="username" placeholder="nome@exemplo.com" value="{{email}}" onChange="{{aoMudarEmail}}" style="width: 100%; height: 44px; box-sizing: border-box; padding: 0 12px 0 38px; border: 1px solid #8A94A0; border-radius: 6px; background: #FFFFFF; font-size: 14px; color: #0F2440">
</span>
</label>

<label style="display: flex; flex-direction: column; gap: 6px">
<span style="font-size: 11px; font-weight: 600; letter-spacing: 0.06em; text-transform: uppercase; color: #5A6472">Senha</span>
<span style="position: relative; display: block">
<span aria-hidden="true" style="position: absolute; left: 12px; top: 14px; color: #5A6472; display: flex"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.25" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg></span>
<input type="{{tipoSenha}}" autocomplete="current-password" placeholder="Sua senha" value="{{senha}}" onChange="{{aoMudarSenha}}" style="width: 100%; height: 44px; box-sizing: border-box; padding: 0 48px 0 38px; border: 1px solid #8A94A0; border-radius: 6px; background: #FFFFFF; font-size: 14px; color: #0F2440">
<button type="button" onClick="{{alternarSenha}}" aria-label="{{rotuloSenha}}" style="position: absolute; right: 0; top: 0; width: 44px; height: 44px; border: 0; background: transparent; color: #5A6472; display: flex; align-items: center; justify-content: center; cursor: pointer; border-radius: 6px"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.25" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2.06 12.35a1 1 0 0 1 0-.7 10.75 10.75 0 0 1 19.88 0 1 1 0 0 1 0 .7 10.75 10.75 0 0 1-19.88 0"/><circle cx="12" cy="12" r="3"/></svg></button>
</span>
</label>
</div>

<sc-if value="{{mostrarErro}}" hint-placeholder-val="{{true}}">
<div role="alert" style="display: flex; gap: 10px; padding: 12px; border-radius: 6px; background: #FCEDED; border: 1px solid #F2C9C9">
<span style="color: #B91C1C; display: flex; padding-top: 1px"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 8v4M12 16h.01"/></svg></span>
<div style="display: flex; flex-direction: column; gap: 2px">
<span style="font-size: 14px; font-weight: 600; color: #B91C1C">E-mail ou senha incorretos</span>
<span style="font-size: 12px; line-height: 18px; color: #7F1D1D">Confira os dados e tente novamente. Após várias tentativas seguidas, o acesso é bloqueado temporariamente.</span>
</div>
</div>
</sc-if>

<a href="Main.dc.html" style="height: 48px; border-radius: 6px; background: #1E3A5F; color: #FFFFFF; font-size: 14px; font-weight: 600; text-decoration: none; display: flex; align-items: center; justify-content: center">Entrar</a>

<div style="border-top: 1px solid #E3E6EA; padding-top: 8px; display: flex; flex-direction: column; gap: 12px">
<button type="button" onClick="{{alternarCadastro}}" aria-expanded="{{cadastroAberto}}" style="align-self: center; height: 44px; padding: 0 12px; border: 0; border-radius: 6px; background: transparent; color: #1E3A5F; font-size: 14px; font-weight: 500; display: inline-flex; align-items: center; gap: 6px; cursor: pointer">
<span>Primeiro acesso? <span style="font-weight: 600">Criar conta</span></span>
<sc-if value="{{cadastroFechado}}" hint-placeholder-val="{{true}}"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.25" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m6 9 6 6 6-6"/></svg></sc-if>
<sc-if value="{{cadastroAberto}}" hint-placeholder-val="{{false}}"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.25" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m18 15-6-6-6 6"/></svg></sc-if>
</button>

<sc-if value="{{cadastroAberto}}" hint-placeholder-val="{{false}}">
<div style="display: flex; flex-direction: column; gap: 16px; padding: 16px; border-radius: 6px; background: #F5F6F8; border: 1px solid #E3E6EA">
<div style="display: flex; flex-direction: column; gap: 2px">
<span style="font-size: 16px; font-weight: 600; letter-spacing: -0.01em">Nova conta</span>
<span style="font-size: 12px; color: #5A6472">Acesso para quem registra encomendas e pagamentos.</span>
</div>
<label style="display: flex; flex-direction: column; gap: 6px">
<span style="font-size: 11px; font-weight: 600; letter-spacing: 0.06em; text-transform: uppercase; color: #5A6472">Nome completo</span>
<input type="text" autocomplete="name" placeholder="Como aparece nos registros" style="width: 100%; height: 44px; box-sizing: border-box; padding: 0 12px; border: 1px solid #8A94A0; border-radius: 6px; background: #FFFFFF; font-size: 14px; color: #0F2440">
</label>
<label style="display: flex; flex-direction: column; gap: 6px">
<span style="font-size: 11px; font-weight: 600; letter-spacing: 0.06em; text-transform: uppercase; color: #5A6472">E-mail</span>
<input type="email" autocomplete="email" placeholder="nome@exemplo.com" style="width: 100%; height: 44px; box-sizing: border-box; padding: 0 12px; border: 1px solid #8A94A0; border-radius: 6px; background: #FFFFFF; font-size: 14px; color: #0F2440">
</label>
<label style="display: flex; flex-direction: column; gap: 6px">
<span style="font-size: 11px; font-weight: 600; letter-spacing: 0.06em; text-transform: uppercase; color: #5A6472">Senha</span>
<input type="password" autocomplete="new-password" placeholder="Crie uma senha" style="width: 100%; height: 44px; box-sizing: border-box; padding: 0 12px; border: 1px solid #8A94A0; border-radius: 6px; background: #FFFFFF; font-size: 14px; color: #0F2440">
<span style="font-size: 12px; color: #5A6472">Use ao menos 12 caracteres.</span>
</label>
<label style="display: flex; flex-direction: column; gap: 6px">
<span style="font-size: 11px; font-weight: 600; letter-spacing: 0.06em; text-transform: uppercase; color: #5A6472">Confirmar senha</span>
<input type="password" autocomplete="new-password" placeholder="Repita a senha" aria-invalid="{{confirmacaoInvalida}}" style="width: 100%; height: 44px; box-sizing: border-box; padding: 0 12px; border: 1px solid {{bordaConfirmacao}}; border-radius: 6px; background: #FFFFFF; font-size: 14px; color: #0F2440">
<sc-if value="{{confirmacaoInvalida}}" hint-placeholder-val="{{false}}">
<span style="display: inline-flex; align-items: center; gap: 6px; font-size: 12px; font-weight: 500; color: #B91C1C"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.25" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 8v4M12 16h.01"/></svg>As senhas não coincidem.</span>
</sc-if>
</label>
<button type="button" style="height: 48px; border-radius: 6px; border: 1px solid #1E3A5F; background: #FFFFFF; color: #1E3A5F; font-size: 14px; font-weight: 600; cursor: pointer">Criar conta</button>
</div>
</sc-if>
</div>

</form>
<p style="margin: 0; text-align: center; font-size: 12px; color: rgba(255,255,255,0.72)">Acesso restrito à equipe Mira Salgados</p>
</div>

</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"mostrarErro":{"editor":"boolean","default":true},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(...args) {
    super(...args);
    this.state = { cadastroAberto: false, senhaVisivel: false, email: 'lucia@exemplo.com', senha: 'senhaerrada' };
  }

  renderVals() {
    const { cadastroAberto, senhaVisivel, email, senha } = this.state;
    return {
      mostrarErro: this.props.mostrarErro ?? true,
      email,
      senha,
      aoMudarEmail: (e) => this.setState({ email: e.target.value }),
      aoMudarSenha: (e) => this.setState({ senha: e.target.value }),
      aoEnviar: (e) => e.preventDefault(),
      tipoSenha: senhaVisivel ? 'text' : 'password',
      rotuloSenha: senhaVisivel ? 'Ocultar senha' : 'Mostrar senha',
      alternarSenha: () => this.setState({ senhaVisivel: !senhaVisivel }),
      cadastroAberto,
      cadastroFechado: !cadastroAberto,
      alternarCadastro: () => this.setState({ cadastroAberto: !cadastroAberto }),
      confirmacaoInvalida: false,
      bordaConfirmacao: '#8A94A0'
    };
  }
}
</script>
</body>
</html>
