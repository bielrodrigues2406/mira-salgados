<svg
  [attr.width]="tamanho()"
  [attr.height]="tamanho()"
  viewBox="0 0 24 24"
  fill="none"
  stroke="currentColor"
  [attr.stroke-width]="espessura()"
  stroke-linecap="round"
  stroke-linejoin="round"
  aria-hidden="true"
  focusable="false"
>
  @for (forma of formas(); track $index) {
    @switch (forma.tipo) {
      @case ('path') {
        <svg:path [attr.d]="forma.d" [attr.fill]="forma.preenchido ? 'currentColor' : null" />
      }
      @case ('circle') {
        <svg:circle [attr.cx]="forma.cx" [attr.cy]="forma.cy" [attr.r]="forma.r" />
      }
      @case ('rect') {
        <svg:rect
          [attr.x]="forma.x"
          [attr.y]="forma.y"
          [attr.width]="forma.width"
          [attr.height]="forma.height"
          [attr.rx]="forma.rx"
        />
      }
    }
  }
</svg>
