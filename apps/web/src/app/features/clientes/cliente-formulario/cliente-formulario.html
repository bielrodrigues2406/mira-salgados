<form class="formulario" [attr.aria-labelledby]="id + '-titulo'" [formRoot]="formulario">
  <div class="formulario-cabecalho">
    <h2 class="texto-titulo" [id]="id + '-titulo'">{{ titulo() }}</h2>
    <button
      type="button"
      class="botao botao-terciario botao-icone fechar"
      aria-label="Fechar formulário"
      (click)="cancelar.emit()"
    >
      <ms-icone nome="fechar" [tamanho]="20" />
    </button>
  </div>

  <div class="campo">
    <label class="texto-rotulo" [for]="id + '-nome'">Nome</label>
    <input
      #campoNome
      class="campo-entrada"
      autocomplete="off"
      placeholder="Nome ou empresa"
      [id]="id + '-nome'"
      [formField]="formulario.nome"
      [attr.aria-invalid]="formulario.nome().touched() && formulario.nome().invalid()"
      [attr.aria-describedby]="id + '-nome-erro'"
    />
    <ms-erros-do-campo [id]="id + '-nome-erro'" [estado]="formulario.nome()" />
  </div>

  <div class="campo">
    <label class="texto-rotulo" [for]="id + '-telefone'">Telefone</label>
    <input
      class="campo-entrada numerico"
      type="tel"
      inputmode="tel"
      autocomplete="off"
      placeholder="(00) 00000-0000"
      [id]="id + '-telefone'"
      [formField]="formulario.telefone"
      [attr.aria-invalid]="formulario.telefone().touched() && formulario.telefone().invalid()"
      [attr.aria-describedby]="id + '-telefone-erro'"
    />
    <ms-erros-do-campo [id]="id + '-telefone-erro'" [estado]="formulario.telefone()" />
  </div>

  <div class="campo">
    <label class="texto-rotulo" [for]="id + '-endereco'">Endereço</label>
    <input
      class="campo-entrada"
      autocomplete="off"
      placeholder="Rua, número e bairro"
      [id]="id + '-endereco'"
      [formField]="formulario.endereco"
      [attr.aria-invalid]="formulario.endereco().touched() && formulario.endereco().invalid()"
      [attr.aria-describedby]="id + '-endereco-ajuda ' + id + '-endereco-erro'"
    />
    <span class="campo-ajuda" [id]="id + '-endereco-ajuda'"
      >Opcional para quem só faz retirada.</span
    >
    <ms-erros-do-campo [id]="id + '-endereco-erro'" [estado]="formulario.endereco()" />
  </div>

  @if (edicao()) {
    <div class="opcao">
      <input
        type="checkbox"
        class="opcao-caixa"
        [id]="id + '-ativo'"
        [formField]="formulario.ativo"
        [attr.aria-describedby]="id + '-ativo-ajuda'"
      />
      <span class="opcao-textos">
        <label class="opcao-rotulo" [for]="id + '-ativo'">Cliente ativo</label>
        <span class="campo-ajuda" [id]="id + '-ativo-ajuda'">
          Inativos saem da lista e da busca de novos pedidos, mas continuam no histórico.
        </span>
      </span>
    </div>
  }

  @if (erro(); as mensagem) {
    <div class="alerta alerta-negativo" role="alert">
      <ms-icone nome="alerta" [tamanho]="20" />
      <span>{{ mensagem }}</span>
    </div>
  }

  <div class="formulario-acoes">
    <button
      type="submit"
      class="botao botao-primario salvar"
      [disabled]="formulario().submitting()"
    >
      {{ formulario().submitting() ? 'Salvando…' : rotuloSalvar() }}
    </button>
    <button type="button" class="botao botao-secundario" (click)="cancelar.emit()">Cancelar</button>
  </div>
</form>
