<h1 class="texto-display">Relatórios</h1>

<nav class="abas" aria-label="Relatórios">
  @for (aba of abas; track aba.rota) {
    <a
      #link
      class="aba"
      [routerLink]="aba.rota"
      routerLinkActive="ativa"
      ariaCurrentWhenActive="page"
      (isActiveChange)="aoAtivar($event, link)"
    >
      {{ aba.rotulo }}
    </a>
  }
</nav>

<router-outlet />
