name: CI

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  HUSKY: '0'

jobs:
  verificacao:
    name: Lint, tipos, testes e build
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      postgres:
        image: postgres:18.6-alpine
        env:
          POSTGRES_USER: mira
          POSTGRES_PASSWORD: mira
          POSTGRES_DB: mira_salgados_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U mira -d mira_salgados_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Instalar dependências
        run: npm ci

      - name: Dependências sem vulnerabilidades conhecidas
        run: npm audit --omit=dev --audit-level=moderate

      - name: Formatação
        run: npm run format:check

      - name: Lint
        run: npm run lint

      - name: Tipos
        run: npm run typecheck

      - name: Testes unitários
        run: npm test

      - name: Testes de integração da API
        run: npm run test:integration --workspace @mira/api
        env:
          TEST_DATABASE_URL: postgres://mira:mira@localhost:5432/mira_salgados_test

      - name: Build
        run: npm run build

  imagens:
    name: Imagens Docker
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      - name: Imagem da API
        uses: docker/build-push-action@v7
        with:
          context: .
          file: docker/api.Dockerfile
          push: false
          cache-from: type=gha,scope=api
          cache-to: type=gha,scope=api,mode=max

      - name: Imagem da web
        uses: docker/build-push-action@v7
        with:
          context: .
          file: docker/web.Dockerfile
          push: false
          cache-from: type=gha,scope=web
          cache-to: type=gha,scope=web,mode=max
