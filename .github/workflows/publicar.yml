name: Publicar imagens

# Depois do CI verde no master, publica as imagens no GitHub Container
# Registry. O servidor só baixa e sobe: não compila nada, e uma VPS pequena
# não precisa de memória para o build do Angular.
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [master]

permissions:
  contents: read
  packages: write

concurrency:
  group: publicar
  cancel-in-progress: false

jobs:
  publicar:
    name: API e web no GHCR
    if: github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      REGISTRO: ghcr.io/${{ github.repository_owner }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Versão
        id: versao
        run: echo "curta=$(echo '${{ github.event.workflow_run.head_sha }}' | cut -c1-7)" >> "$GITHUB_OUTPUT"

      - name: Imagem da API
        uses: docker/build-push-action@v7
        with:
          context: .
          file: docker/api.Dockerfile
          platforms: linux/amd64
          push: true
          tags: |
            ${{ env.REGISTRO }}/mira-salgados-api:latest
            ${{ env.REGISTRO }}/mira-salgados-api:${{ steps.versao.outputs.curta }}
          cache-from: type=gha,scope=api
          cache-to: type=gha,scope=api,mode=max

      - name: Imagem da web
        uses: docker/build-push-action@v7
        with:
          context: .
          file: docker/web.Dockerfile
          platforms: linux/amd64
          push: true
          tags: |
            ${{ env.REGISTRO }}/mira-salgados-web:latest
            ${{ env.REGISTRO }}/mira-salgados-web:${{ steps.versao.outputs.curta }}
          cache-from: type=gha,scope=web
          cache-to: type=gha,scope=web,mode=max
